name: Validate public plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Contract and public-surface validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Confirm the runner Node.js version
        run: |
          set -euo pipefail
          node --version
          node --input-type=module -e 'if (Number(process.versions.node.split(".")[0]) < 20) throw new Error("Node.js 20 or newer is required for the public-plugin contract gate.")'

      - name: Parse tracked JSON
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { existsSync, readFileSync } from "node:fs";

          const files = execFileSync("git", ["ls-files", "-z"], { encoding: "utf8" })
            .split("\0")
            .filter((file) => file.endsWith(".json") && existsSync(file));
          for (const file of files) JSON.parse(readFileSync(file, "utf8"));
          console.log(`Parsed ${files.length} tracked JSON file(s).`);
          NODE

      - name: Validate Codex manifest, public contract, and OAuth discovery
        run: |
          node scripts/verify-plugin-contract.mjs --self-test
          node scripts/verify-plugin-contract.mjs

      - name: Scan staged and worktree content for private paths or credentials
        if: always()
        run: |
          set -euo pipefail
          git diff --check
          git diff --cached --check
          if git diff --cached --name-only | grep -E '(^|/)(\.env|.*\.pem|.*\.key|.*credentials.*\.json)$'; then
            echo "A staged secret-bearing file is present."
            exit 1
          fi
          if git diff --name-only | grep -E '(^|/)(\.env|.*\.pem|.*\.key|.*credentials.*\.json)$'; then
            echo "A secret-bearing worktree file is present."
            exit 1
          fi
          if git grep -nEI -- '([A-Za-z]:[\\/](Users|home)[\\/]|/(Users|home)/|(^|[[:space:]])~([\\/]|[[:space:]]|$)|(^|[[:space:]])[$]H[O]M[E]([\\/]|[[:space:]]|$))' ; then
            echo "Private filesystem path found in tracked public content."
            exit 1
          fi
